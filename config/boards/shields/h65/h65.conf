CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
#nkro
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=30
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=30

#fast ble
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

#fast usb
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# USB debug logging: left disabled. Enabling CONFIG_ZMK_USB_LOGGING requires a
# working UART/console, but this board's uart0 pins (P0.08/P0.06) are used by
# the key matrix, so enabling it breaks the Kconfig build (dependency warnings
# are fatal).
# CONFIG_ZMK_USB_LOGGING=y
